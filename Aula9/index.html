<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteúdo Aula 09 - HTML</title>
    </head>
    <body>

        <h1>Imagens em Html</h1>

        <img src="chihiro003.jpg" alt="paisagem chihiro" widht="400" height="206">

        <hr>

        <h3>Alterando tamanho de imagens com o CSS</h3>
        
        <img src="chihiro003.jpg" alt="paisagem chihiro" style="width: 400px; height: 206px;">

        <hr>

        <h3>Definindo imagens localizadas em outra pasta</h3>

        <img src="/Aula9/img/pombo.jpg" alt="pombo do ata" style="width: 250px; height: 250px;">

        <hr>

        <h3>Definindo imagens dinâmicas no HTML (gif)</h3>

        <img src="/Aula9/img/programming.gif" alt="Homem no Computador" style="width: 100px; height: 100px;">

        <hr>

        <h3>Imagens Flutuantes no HTML</h3>

        <p>
            <img src="/Aula9/img/programming.gif" style="float: right;">
            Somente a dor coletiva gera união.
        </p>

    </body>
</html>
