<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteúdo Aula 11 - HTML</title>
    </head>
    <body>

        <h1>Div no HTML</h1>

        <div style="background-color: crimson; font-family: sans-serif; color: ghostwhite; padding: 20px;">
            <h2>Isso é um h2.</h2>
            <p>Isso é um parágrafo.</p>
            <p>Isso é outro parágrafo.</p>
        </div>

        <p>Isso é um parágrafo fora da div.</p>

        <hr>

        <h3>CentralizandO DIV na página</h3>

        <div style="background-color: orange; font-family: sans-serif; padding: 20px; width: 200px;margin: auto;">
            <h2>Isso é um h2.</h2>
            <p>Isso é um parágrafo.</p>
            <p>Isso é outro parágrafo.</p>
        </div>
    </body>
</html>
