<!DOCTYPE html>
<html lang=“pt-br”>
    <head>
        <title>Conteúdo Aula06 - HTML</title>
    </head>
    <body>
        
        <p style=“font-size:30px; font-weight: bold;”>Eu estou destacado</p>

        <hr>

        <h3>Definindo cores de fundo com o atributo style no HTML:</h3>

        <h2 style=“background-color: tomato;”>Eu sou o h2</h2>
        <p style=“background-color: crimson;”>Eu sou o parágrafo</p>

        <hr>

        <h3>Definindo fontes em textos no HTML:</h3>

        <p style=“font-family: Verdana, Geneva, Tahoma, sans-serif;”>Isso é um parágrafo</p>
        <p style=“font-family: monospace;”>Isso é outro parágrafo</p>

        <hr>

        <h3>Definindo alinhamento de textos em HTML com o text-align</h3>

        <h2 style=“text-align: center;”>H2 Centralizado</h2>
        <p style=“text-align: center;”>Parágrafo Centralizado</p>

    </body>
</html>
