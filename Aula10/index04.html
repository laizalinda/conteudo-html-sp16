<!DOCTYPE html>
<html lamg="pt-bt">
    <head>
        <title>Conteúdo Aula 10</title>

        <style>

            .lista dt {
                display: list-item;
                list-style-type: disc;
                margin-left: 20px;
            }

        </style>
    </head>
    <body>

        <h1>Lista no HTML</h1>

        <h3>Exemplo de lista Não Ordenada no HTML</h3>

        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
            <li>Item 4</li>
            <li>Item 5</li>
        </ul>

        <hr>

        <ol>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
            <li>Item 4</li>
            <li>Item 5</li>
        </ol>

        <hr>

        <h3>Exemplo de lista Descritiva no Html</h3>

        <dl>
            <dt>Carro</dt>
            <dd>Veículo que possui 4 rodas.</dd>
            <br>
            <dt>Moto</dt>
            <dd>Veículo que possui 2 rodas.</dd>
        </dl>


    </body>
</html>
